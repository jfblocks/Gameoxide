                        height: this.player.height
                    };
                    
                    if (this.checkCollision(playerRect, coin)) {
                        const coinValue = this.activePowerUps.doubleCoin ? 2 : 1;
						console.log(this.coins);
                        this.coinCount += coinValue;
                        this.score += 100;
                        this.createParticles(coin.x, coin.y, 8, '#FFD700');
						console.log(this.coins);
                        this.coins.splice(i, 1);
                    }
                }
                
                // 检查道具碰撞
                for (let i = this.powerUps.length - 1; i >= 0; i--) {
                    const powerUp = this.powerUps[i];
                    const playerRect = {
                        x: this.player.x - this.player.width / 2,
                        y: this.player.y,
                        width: this.player.width,
                        height: this.player.height
                    };
                    
                    if (this.checkCollision(playerRect, powerUp)) {
                        this.activatePowerUp(powerUp.type);
                        this.createParticles(powerUp.x, powerUp.y, 10, powerUp.color);
                        this.powerUps.splice(i, 1);
                    }
                }
            }

            checkCollision(rect1, rect2) {
                return rect1.x < rect2.x + rect2.width &&
                       rect1.x + rect1.width > rect2.x &&
                       rect1.y < rect2.y + rect2.height &&
                       rect1.y + rect1.height > rect2.y;
            }

            takeDamage() {
                this.player.lives--;
                this.player.invulnerable = true;
                this.player.invulnerableTime = 120; // 2秒无敌
                
                this.updateHearts();
                this.createParticles(this.player.x, this.player.y, 12, '#FF6B6B');
                
                if (this.player.lives <= 0) {
                    this.gameOver();
                }
            }

            activatePowerUp(type) {
                this.activePowerUps[type] = true;
                this.powerUpTimers[type] = 8000; // 8秒持续时间
                this.updatePowerUpUI();
                
                // 特殊效果
                switch(type) {
                    case 'sprint':
                        this.speed = this.maxSpeed * 1.5;
                        setTimeout(() => {
                            this.speed = this.baseSpeed;
                        }, 8000);
                        break;
                    case 'shield':
                        this.player.invulnerable = true;
                        this.player.invulnerableTime = 8000;
                        break;
                }
            }

            updatePowerUpUI() {
                const slots = ['powerUpSlot1', 'powerUpSlot2'];
                let slotIndex = 0;
                
                Object.keys(this.activePowerUps).forEach(type => {
                    if (this.activePowerUps[type] && slotIndex < 2) {
                        const slot = document.getElementById(slots[slotIndex]);
                        slot.textContent = this.getPowerUpIcon(type);
                        slot.classList.add('active');
                        slotIndex++;
                    }
                });
                
                // 清空未使用的槽位
                for (let i = slotIndex; i < 2; i++) {
                    const slot = document.getElementById(slots[i]);
                    slot.textContent = '';
                    slot.classList.remove('active');
                }
            }

            gameOver() {
                this.gameState = 'gameOver';
                this.ui.gameOver.style.display = 'block';
                this.ui.finalScore.textContent = this.score;
                this.ui.finalCoins.textContent = this.coinCount;
            }

            render() {
                // 清空画布
                this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
                
                // 绘制背景
                this.renderBackground();
                
                // 绘制跑道
                this.renderLanes();
                
                // 绘制游戏对象
                this.renderObstacles();
                this.renderCoins();
                this.renderPowerUps();
                this.renderPlayer();
                this.renderParticles();
                
                // 绘制特效
                if (this.player.invulnerable) {
                    this.renderInvulnerableEffect();
                }
                
                if (this.activePowerUps.shield) {
                    this.renderShieldEffect();
                }
                
                if (this.activePowerUps.magnet) {
                    this.renderMagnetEffect();
                }
                
                if (this.activePowerUps.sprint) {
                    this.renderSprintEffect();
                }
            }

            renderBackground() {
                // 天空渐变
                const gradient = this.ctx.createLinearGradient(0, 0, 0, this.canvas.height);
                gradient.addColorStop(0, '#87CEEB');
                gradient.addColorStop(1, '#98FB98');
                this.ctx.fillStyle = gradient;
                this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
                
                // 绘制背景元素
                this.backgrounds.forEach(bg => {
                    this.ctx.save();
                    this.ctx.globalAlpha = 0.3;
                    
                    if (bg.type === 'building') {
                        this.ctx.fillStyle = '#666';
                        this.ctx.fillRect(bg.x, bg.y, bg.width, bg.height);
                        
                        // 窗户
                        this.ctx.fillStyle = '#FFD700';
                        for (let i = 0; i < 3; i++) {
                            for (let j = 0; j < 5; j++) {
                                if (Math.random() > 0.3) {
                                    this.ctx.fillRect(
                                        bg.x + 10 * this.scale + i * 25 * this.scale,
                                        bg.y + 10 * this.scale + j * 20 * this.scale,
                                        15 * this.scale,
                                        15 * this.scale
                                    );
                                }
                            }
                        }
                    } else {
                        // 云朵
                        this.ctx.fillStyle = '#fff';
                        this.ctx.beginPath();
                        this.ctx.arc(bg.x + 25 * this.scale, bg.y + 25 * this.scale, 25 * this.scale, 0, Math.PI * 2);
                        this.ctx.arc(bg.x + 45 * this.scale, bg.y + 25 * this.scale, 35 * this.scale, 0, Math.PI * 2);
                        this.ctx.arc(bg.x + 65 * this.scale, bg.y + 25 * this.scale, 25 * this.scale, 0, Math.PI * 2);
                        this.ctx.fill();
                    }
                    
                    this.ctx.restore();
                });
            }

            renderLanes() {
                // 绘制跑道线
                this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                this.ctx.lineWidth = 2 * this.scale;
                this.ctx.setLineDash([20 * this.scale, 10 * this.scale]);
                
                for (let i = 0; i < 2; i++) {
                    const x = this.lanes[i] + (this.lanes[i + 1] - this.lanes[i]) / 2;
                    this.ctx.beginPath();
                    this.ctx.moveTo(x, 0);
                    this.ctx.lineTo(x, this.canvas.height);
                    this.ctx.stroke();
                }
                
                this.ctx.setLineDash([]);
            }

            renderObstacles() {
                this.obstacles.forEach(obstacle => {
                    this.ctx.fillStyle = obstacle.color;
                    this.ctx.fillRect(
                        obstacle.x - obstacle.width / 2,
                        obstacle.y,
                        obstacle.width,
                        obstacle.height
                    );
                    
                    // 添加警告标记
                    this.ctx.fillStyle = '#fff';
                    this.ctx.font = `${20 * this.scale}px Arial`;
                    this.ctx.textAlign = 'center';
                    this.ctx.fillText('!', obstacle.x, obstacle.y + obstacle.height / 2);
                });
            }

            renderCoins() {
                this.coins.forEach(coin => {
                    this.ctx.save();
                    this.ctx.translate(coin.x, coin.y);
                    this.ctx.rotate(coin.rotation);
                    
                    // 金币外圈
                    this.ctx.fillStyle = '#FFD700';
                    this.ctx.beginPath();
                    this.ctx.arc(0, 0, coin.width / 2, 0, Math.PI * 2);
                    this.ctx.fill();
                    
                    // 金币内圈
                    this.ctx.fillStyle = '#FFA500';
                    this.ctx.beginPath();
                    this.ctx.arc(0, 0, coin.width / 3, 0, Math.PI * 2);
                    this.ctx.fill();
                    
                    // 金币符号
                    this.ctx.fillStyle = '#FFD700';
                    this.ctx.font = `${coin.width}px Arial`;
                    this.ctx.textAlign = 'center';
                    this.ctx.fillText('$', 0, coin.width / 4);
                    
                    this.ctx.restore();
                });
            }

            renderPowerUps() {
                this.powerUps.forEach(powerUp => {
                    this.ctx.save();
                    this.ctx.translate(powerUp.x, powerUp.y);
                    
                    // 道具背景
                    this.ctx.fillStyle = powerUp.color;
                    this.ctx.beginPath();
                    this.ctx.arc(0, 0, powerUp.width / 2, 0, Math.PI * 2);
                    this.ctx.fill();
                    
                    // 道具图标
                    this.ctx.fillStyle = '#fff';
                    this.ctx.font = `${powerUp.width}px Arial`;
                    this.ctx.textAlign = 'center';
                    this.ctx.fillText(powerUp.icon, 0, powerUp.width / 4);
                    
                    // 旋转效果
                    this.ctx.rotate(Date.now() / 1000);
                    
                    this.ctx.restore();
                });
            }

            renderPlayer() {
                this.ctx.save();
                
                // 无敌闪烁效果
                if (this.player.invulnerable && Math.floor(Date.now() / 100) % 2) {
                    this.ctx.globalAlpha = 0.5;
                }
                
                // 玩家身体
                this.ctx.fillStyle = '#4CAF50';
                this.ctx.fillRect(
                    this.player.x - this.player.width / 2,
                    this.player.y,
                    this.player.width,
                    this.player.height
                );
                
                // 玩家眼睛
                this.ctx.fillStyle = '#fff';
                this.ctx.fillRect(
                    this.player.x - this.player.width / 2 + 5 * this.scale,
                    this.player.y + 10 * this.scale,
                    8 * this.scale,
                    8 * this.scale
                );
                this.ctx.fillRect(
                    this.player.x + this.player.width / 2 - 13 * this.scale,
                    this.player.y + 10 * this.scale,
                    8 * this.scale,
                    8 * this.scale
                );
                
                // 玩家嘴巴
                this.ctx.fillStyle = '#fff';
                this.ctx.fillRect(
                    this.player.x - 5 * this.scale,
                    this.player.y + 30 * this.scale,
                    10 * this.scale,
                    5 * this.scale
                );
                
                this.ctx.restore();
            }

            renderParticles() {
                this.particles.forEach(particle => {
                    this.ctx.save();
                    this.ctx.globalAlpha = particle.life;
                    this.ctx.fillStyle = particle.color;
                    this.ctx.beginPath();
                    this.ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
                    this.ctx.fill();
                    this.ctx.restore();
                });
            }

            renderInvulnerableEffect() {
                this.ctx.save();
                this.ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                this.ctx.lineWidth = 2 * this.scale;
                this.ctx.beginPath();
                this.ctx.arc(
                    this.player.x,
                    this.player.y + this.player.height / 2,
                    this.player.width,
                    0,
                    Math.PI * 2
                );
                this.ctx.stroke();
                this.ctx.restore();
            }

            renderShieldEffect() {
                this.ctx.save();
                this.ctx.strokeStyle = 'rgba(33, 150, 243, 0.5)';
                this.ctx.lineWidth = 3 * this.scale;
                this.ctx.beginPath();
                this.ctx.arc(
                    this.player.x,
                    this.player.y + this.player.height / 2,
                    this.player.width + 5 * this.scale,
                    0,
                    Math.PI * 2
                );
                this.ctx.stroke();
                this.ctx.restore();
            }

            renderMagnetEffect() {
                this.ctx.save();
                this.ctx.strokeStyle = 'rgba(156, 39, 176, 0.3)';
                this.ctx.lineWidth = 1 * this.scale;
                this.ctx.beginPath();
                this.ctx.arc(
                    this.player.x,
                    this.player.y + this.player.height / 2,
                    150 * this.scale,
                    0,
                    Math.PI * 2
                );
                this.ctx.stroke();
                this.ctx.restore();
            }

            renderSprintEffect() {
                // 冲刺时的速度线
                this.ctx.save();
                this.ctx.strokeStyle = 'rgba(255, 87, 34, 0.5)';
                this.ctx.lineWidth = 2 * this.scale;
                
                for (let i = 0; i < 10; i++) {
                    this.ctx.beginPath();
                    this.ctx.moveTo(
                        Math.random() * this.canvas.width,
                        Math.random() * this.canvas.height
                    );
                    this.ctx.lineTo(
                        Math.random() * this.canvas.width,
                        Math.random() * this.canvas.height
                    );
                    this.ctx.stroke();
                }
                
                this.ctx.restore();
            }

            gameLoop() {
                const currentTime = Date.now();
                const deltaTime = currentTime - this.lastTime;
                
                if (deltaTime >= 1000 / 60) { // 60 FPS
                    this.update(deltaTime);
                    this.render();
                    this.lastTime = currentTime;
                }
                
                requestAnimationFrame(() => this.gameLoop());
            }

            start() {
                this.lastTime = Date.now();
                this.gameLoop();
            }
        }

        // 初始化游戏
        window.addEventListener('load', () => {
            const game = new Game();
            game.start();
            
            // 添加触摸支持
            if ('ontouchstart' in window) {
                document.getElementById('mobileControls').style.display = 'flex';
            }
        });

        // 防止页面滚动
        document.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, { passive: false });

        // 处理页面可见性变化
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                // 页面隐藏时暂停游戏
                if (window.game && window.game.gameState === 'playing') {
                    window.game.togglePause();
                }
            }
        });
    </script>
</body>
</html>
